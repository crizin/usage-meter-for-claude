<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Usage Meter for Claude</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hd">
    <div class="hd-txt">
      <h1>Claude usage</h1>
      <p id="meta" class="meta">Loading…</p>
    </div>
    <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
      </svg>
    </button>
  </header>

  <main id="body" class="body">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </main>

  <footer class="ft">
    <a id="open-settings" href="#">Open usage settings on claude.ai ↗</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
