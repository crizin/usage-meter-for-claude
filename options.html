<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Usage Meter for Claude — options</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>Toolbar badge</h1>
  <p class="lead">Choose which figure the badge shows. The popup always lists every organization and limit.</p>

  <label class="field field--check">
    <input type="checkbox" id="show">
    <span>Show a figure on the toolbar badge</span>
  </label>
  <label class="field">
    <span>Organization</span>
    <select id="org"></select>
  </label>
  <label class="field">
    <span>Limit</span>
    <select id="limit"></select>
  </label>

  <div class="preview">
    <span class="preview-label">Badge right now</span>
    <span id="badge" class="badge"></span>
    <span id="scope" class="scope"></span>
  </div>
  <p id="hint" class="hint" hidden>Open the popup once so the organizations on your account are listed here.</p>

  <script type="module" src="options.js"></script>
</body>
</html>
